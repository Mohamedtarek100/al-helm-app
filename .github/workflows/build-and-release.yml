name: Build and publish 4uLife Web release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-and-release.yml'
      - '.build-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 4ulife-web-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Mohamedtarek100/al-helm
  SOURCE_REF: 7aa46d581fa6cdc8a75ce4236db6fb700f738995
  RELEASE_TAG: v1.5.6-web
  RELEASE_TITLE: 4uLife 1.5.6 — Web / PWA

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout distribution repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: Mohamedtarek100/al-helm
          ref: 7aa46d581fa6cdc8a75ce4236db6fb700f738995
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: TypeScript — web app
        working-directory: source
        run: npm run check:types

      - name: TypeScript — Supabase Edge Functions
        working-directory: source
        run: npm run check:edge

      - name: Translation parity
        working-directory: source
        run: npm run test:i18n

      - name: Migration consistency
        working-directory: source
        run: npm run check:migrations

      - name: Workflow validation
        working-directory: source
        run: node scripts/check-workflows.mjs

      - name: Unit tests
        working-directory: source
        run: npm run test

      - name: Lint
        working-directory: source
        run: npm run lint

      - name: Build production web app
        working-directory: source
        env:
          VITE_BASE_PATH: /al-helm-app/
          VITE_SUPABASE_URL: https://warepmhybetvjzgvpuqf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_0OKOAoID7NxFoOlmTHgfYg_bvsyQYNV
        run: npm run build

      - name: Scan production bundle for secrets and preview code
        working-directory: source
        run: npm run check:secrets

      - name: Verify built site
        working-directory: source
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          grep -q '/al-helm-app/' dist/index.html
          echo "Production site bundle verified."

      - name: Package web release and checksum
        run: |
          cd source
          zip -qr /tmp/4uLife-1.5.6-web-dist.zip dist
          cd /tmp
          sha256sum 4uLife-1.5.6-web-dist.zip > 4uLife-1.5.6-web-dist.zip.sha256

      - name: Publish built site to al-helm-app main
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/source/' \
            --exclude='/downloads/' \
            --exclude='/ota/' \
            --exclude='/releases/' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            source/dist/ ./

          git config user.name "4uLife release"
          git config user.email "noreply@4ulife.app"
          git add -A
          if git diff --cached --quiet; then
            echo "The website bundle is already current."
          else
            git commit -m "Publish 4uLife 1.5.6 Web/PWA"
            git push origin main
          fi

      - name: Create or update GitHub web release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              /tmp/4uLife-1.5.6-web-dist.zip \
              /tmp/4uLife-1.5.6-web-dist.zip.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              /tmp/4uLife-1.5.6-web-dist.zip \
              /tmp/4uLife-1.5.6-web-dist.zip.sha256 \
              --target "$DEPLOY_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "4uLife 1.5.6 Web/PWA release. The production website is deployed to https://mohamedtarek100.github.io/al-helm-app/. This release contains the web build bundle and SHA-256 checksum. Historical APK downloads and OTA assets were preserved unchanged. No Android APK is included in this web-only release."
          fi
